spring.application.name=FileService
server.port=8082

spring.mvc.problemdetails.enabled=true

#PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/filesdb
spring.datasource.username=fileuser
spring.datasource.password=filepass
spring.datasource.driver-class-name = org.postgresql.Driver

#JPA/Hibenate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# (Optional but recommended) Automatically map camelCase names (e.g. createdAt) to snake_case (e.g. created_at) in the DB.
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

#minio
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=tus-upload-bucket

#flyaway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Service Discovery URL for UserDetailService (running on port 8081)
app.user-service.url=http://localhost:8081

# --- Security Configuration ---
# L'URL base del realm. Il servizio lo userà per scaricare la chiave pubblica e validare la firma dei token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/file-management

# --- Machine to Machine Configuration ---
keycloak.m2m.client-id=fileservice-client
keycloak.m2m.client-secret=yALxr8NrBJHxNOQpwe6FScdKGaTaMTca
keycloak.m2m.token-uri=http://localhost:9090/realms/file-management/protocol/openid-connect/token

# --- KAFKA CONFIGURATION ---
# Se il FileService gira in DOCKER usa: kafka:29092
# Se il FileService gira in INTELLIJ usa: localhost:9092
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic=file-upload.completed

# --- OpenTelemetry ---
#  OTLP exportation
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.logs.endpoint=http://localhost:4318/v1/logs

# sampling configuration (1.0 = traks all)
management.tracing.sampling.probability=1.0
# Espone l'endpoint di Actuator per Prometheus (Utile per il debug)
management.endpoints.web.exposure.include=health,prometheus,metrics
# enables context progragation for Kafka
spring.kafka.producer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v3_0.TracingProducerInterceptor
spring.kafka.consumer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v3_0.TracingConsumerInterceptor

app.ai-service.url=http://localhost:8084