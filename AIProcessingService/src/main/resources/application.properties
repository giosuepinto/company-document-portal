server.port=8084
spring.application.name=AIProcessingService

# --- KAFKA CONFIG ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ai-processing-group-v1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=*
app.kafka.topic=file-upload.completed

# --- FILE SERVICE ---
app.fileservice.url=http://localhost:8082/api/v1/files

# ==========================================
# --- AI CONFIG (Google Gemini via OpenAI) ---
# ==========================================

# 1. Base URL per la compatibilità OpenAI di Google
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY}

# 2. Configurazione CHAT (Gemini Flash Latest)
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.3
# Importante: specifica il path standard di OpenAI
spring.ai.openai.chat.completions-path=/chat/completions
# --- DISABILITA EMBEDDING OPENAI (Per evitare il crash usage=null) ---
spring.ai.openai.embedding.enabled=false
# --- CONFIGURA EMBEDDING LOCALE (Transformers) ---
spring.ai.embedding.transformer.enabled=true

# 3. Configurazione EMBEDDING (Corretto per funzionare con PGVector 768)
# ATTENZIONE: Qui avevi l'errore di battitura. Usa questo:
spring.ai.openai.embedding.options.model=text-embedding-004

# ==========================================
# --- PGVECTOR CONFIG ---
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/filesdb
spring.datasource.username=fileuser
spring.datasource.password=filepass

spring.ai.vectorstore.pgvector.table-name=file_version_embeddings
# Se la tabella esiste già, lascia false. Se è la prima volta, metti true.
spring.ai.vectorstore.pgvector.initialize-schema=false

# DIMENSIONE VETTORE:
# IMPORTANTE: Il modello locale usa vettori da 384 dimensioni (non 768 o 1536)
spring.ai.vectorstore.pgvector.dimensions=384

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# Disabilita le observations per evitare bug sui metadati
spring.ai.vectorstore.observations.include-query-response=false

# ==========================================
# --- SECURITY & KAFKA DESERIALIZATION ---
# ==========================================
spring.security.oauth2.client.registration.keycloak.client-id=ai-service
spring.security.oauth2.client.registration.keycloak.client-secret=SY4HcZuCCpeC6gtg947O76b7vM4rfEge
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9090/realms/file-management

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/file-management

# Kafka Error Handling
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=it.polito.wa2_2026.g15.aiprocessingservice.dto.FileUploadEvent
spring.kafka.consumer.properties.max.poll.interval.ms=600000

# --- OpenTelemetry ---
#  OTLP exportation
management.otlp.tracing.endpoint=http://localhost:4317
management.otlp.metrics.export.url=http://localhost:4317
# sampling configuration (1.0 = traks all)
management.tracing.sampling.probability=1.0
# enables context progragation for Kafka
spring.kafka.producer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v2_6.TracingProducerInterceptor
spring.kafka.consumer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v2_6.TracingConsumerInterceptor