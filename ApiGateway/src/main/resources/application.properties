server.port=8080
spring.application.name=api-gateway
spring.docker.compose.enabled=false

# --- SECURITY ---
spring.security.oauth2.client.registration.gateway-client.provider=keycloak
spring.security.oauth2.client.registration.gateway-client.client-id=gateway-client
spring.security.oauth2.client.registration.gateway-client.client-secret=j22DQRgv8U3IkxAz1vAU41swQRnFDQ4B
spring.security.oauth2.client.registration.gateway-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gateway-client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gateway-client.scope=openid,profile,email

spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:9090/realms/file-management
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/file-management
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username

# --- ROUTES (Prefisso aggiornato: server.webmvc) ---
# FileService
spring.cloud.gateway.mvc.routes[0].id=fileservice
spring.cloud.gateway.mvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/files/**
spring.cloud.gateway.mvc.routes[0].filters[0]=TokenRelay

# Rotta per TUS Uploads (verso FileService)
spring.cloud.gateway.mvc.routes[2].id=tus-upload
spring.cloud.gateway.mvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/uploads/**
spring.cloud.gateway.mvc.routes[2].filters[0]=TokenRelay

# UserDetailService
spring.cloud.gateway.mvc.routes[1].id=userservice
spring.cloud.gateway.mvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.mvc.routes[1].filters[0]=TokenRelay

# --- OpenTelemetry ---
#  OTLP exportation
management.otlp.tracing.endpoint=http://otel-collector:4317
management.otlp.metrics.export.url=http://otel-collector:4317
# sampling configuration (1.0 = traks all)
management.tracing.sampling.probability=1.0
# enables context progragation for Kafka
spring.kafka.producer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v3_0.TracingProducerInterceptor
spring.kafka.consumer.properties.interceptor.classes=io.opentelemetry.instrumentation.kafkaclients.v3_0.TracingConsumerInterceptor