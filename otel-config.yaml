receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # loggs reveived data
  debug:
    verbosity: detailed

  # exporter for Langtrace
  otlphttp/langtrace:
    encoding: json
    compression: none
    traces_endpoint: "https://app.langtrace.ai/api/trace"
    tls:
      insecure: false
    headers:
      x-api-key: "${LANGTRACE_API_KEY}"
      Content-Type: "application/json"

  # Metriche verso Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    resource_to_telemetry_conversion:
      enabled: true

  # Log verso Loki (Utilizzando lo standard OTLP HTTP)
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ debug, otlphttp/langtrace ]
    metrics:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ debug, prometheus ]
    logs:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ debug, otlphttp/loki ]